name: BlisterCheck — Sincronización Catálogo CIMA (Cada 14 días)

on:
  schedule:
    # Días 1 y 15 de cada mes a las 04:00 UTC (06:00 hora Madrid en verano)
    - cron: '0 4 1,15 * *'
  workflow_dispatch: # Permite ejecución manual para pruebas o sync forzado

jobs:
  sync-blistercheck-catalog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install script dependencies
        run: |
          cd scripts
          npm init -y
          npm install @supabase/supabase-js

      - name: Run BlisterCheck catalog sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-blistercheck-catalog.js
